    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background: #000;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 16px 40px;
        }

        /* ── VIDEO ── */
        .video-wrap {
            position: relative;
            width: 100%;
            max-width: 360px;
            aspect-ratio: 9/16;
            background: #111;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            margin-bottom: 24px;
        }

        .video-wrap video,
        .video-wrap img.thumb {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .play-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,.25);
            transition: opacity .2s;
        }

        .play-overlay.hidden { display: none; }

        .play-icon {
            width: 72px;
            height: 72px;
            background: #4CAF50;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 24px rgba(76,175,80,.6);
        }

        .play-icon svg {
            width: 30px;
            height: 30px;
            fill: #fff;
            margin-left: 4px;
        }

        /* Progress bar */
        .video-progress {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 4px;
            width: 0%;
            background: #4CAF50;
            transition: width .5s linear;
        }

        /* ── COPY ── */
        .copy-block {

        .scarcity {

            color: #FF8C00;

        /* ── BUTTON ── */
        .cta-wrap {
            width: 100%;
            max-width: 960px;
            text-align: center;
        }

        .btn-cta {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            background: #4CAF50;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: clamp(15px, 4vw, 20px);
            letter-spacing: 1px;
            text-transform: uppercase;
            white-space: nowrap;
            padding: 22px 32px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            text-decoration: none;
            transition: background .2s, opacity .2s;
            margin-bottom: 10px;
        }

        .btn-cta.locked {

            cursor: not-allowed;
            opacity: .75;
        }

        .btn-cta:not(.locked):hover { background: #43A047; }

        .btn-cta svg {
            width: 22px;
            height: 22px;
            fill: #fff;

        }

        .btn-hint {
            font-size: 13px;
            color: #FF8C00;

        }

<script>
function redirectWithParams(destination) {
    const currentParams = window.location.search;
    if (!currentParams) {
        window.location.href = destination;
        return;
    }
    if (destination.includes("?")) {
        window.location.href = destination + "&" + currentParams.substring(1);
    } else {
        window.location.href = destination + currentParams;
    }
}

function handleCta() {
    redirectWithParams('https://mundoconhecimento.mycartpanda.com/checkout/182879391:1');
}

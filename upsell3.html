    <style>

        .top-bar {

            top: 0;

            display: flex;

        .play-overlay.hidden { display: none; }

        .play-icon {

            align-items: center;
            justify-content: center;

        }

        .play-icon svg {

            height: 30px;

            margin-left: 4px;

        /* Progress bar */
        .video-progress {
            position: absolute;
            bottom: 0;

            background: #4CAF50;

<script>
function redirectWithParams(destination) {
    const currentParams = window.location.search;
    if (!currentParams) {
        window.location.href = destination;
        return;
    }
    if (destination.includes("?")) {
        window.location.href = destination + "&" + currentParams.substring(1);
    } else {
        window.location.href = destination + currentParams;
    }
}

function handleCta() {
    redirectWithParams('https://mundoconhecimento.mycartpanda.com/checkout/182879391:1');
}

var contentRevealed = false;

function revealContent() {
    if (contentRevealed) return;
    contentRevealed = true;
    document.querySelector('.copy-block').classList.add('revealed');
    document.querySelector('.cta-wrap').classList.add('revealed');
    setTimeout(function() {
        document.getElementById('btnDecline').classList.add('visible');
    }, 5000);
}

// Escuta eventos do Panda Video via postMessage
window.addEventListener('message', function(e) {
    try {
        var data = typeof e.data === 'string' ? JSON.parse(e.data) : e.data;
        if (!data) return;
        var percent = null;
        if (data.percentWatched !== undefined) {
            percent = data.percentWatched / 100;
        } else if ((data.event === 'timeupdate' || data.type === 'timeupdate') &&
                   (data.currentTime || data.videoCurrentTime) &&
                   (data.duration || data.videoDuration)) {
            var ct = data.currentTime || data.videoCurrentTime;
            var dur = data.duration || data.videoDuration;
            percent = ct / dur;
        }
        if (percent !== null && percent >= 0.75) {
            revealContent();
        }
    } catch(err) {}
});

// Fallback: revela após 5 minutos caso a API não dispare
setTimeout(revealContent, 300000);
</script>
